name: Daily activity

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 12:00 noon EAT
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for today's log"
        required: false

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Commits only count on your graph if the author email is tied to your account.
      # This looks up your numeric ID and builds your noreply email automatically.
      - name: Set author to your GitHub account
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ID=$(gh api "users/$OWNER" --jq .id)
          git config user.name "$OWNER"
          git config user.email "${ID}+${OWNER}@users.noreply.github.com"

      - name: Append today's entry
        env:
          NOTE: ${{ inputs.note }}
        run: |
          DAY=$(TZ=Africa/Nairobi date +%F)
          echo "- $DAY ${NOTE:-daily check-in}" >> DAILY_LOG.md

      - name: Commit and push
        run: |
          git add DAILY_LOG.md
          git commit -m "log: $(TZ=Africa/Nairobi date +%F)"
          git push
